[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "script"
version = "1.0.0"
description = "SCRIPT by FICUS (ficusai) - Extract scripts, tool calls, and session artifacts from OpenCode databases"
authors = [{ name = "FICUS (ficusai)" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
opencode-extractor = "opencode_extractor.__main__:main"
opencode-extractor-gui = "gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencode_extractor*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120
