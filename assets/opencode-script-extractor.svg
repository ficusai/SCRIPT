<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
    <linearGradient id="ficusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Code Bracket & Extract Terminal Shape -->
  <rect x="64" y="64" width="384" height="384" rx="36" fill="#11111b" stroke="#313244" stroke-width="6"/>

  <!-- Top Terminal Bar Dots -->
  <circle cx="104" cy="104" r="10" fill="#f38ba8"/>
  <circle cx="134" cy="104" r="10" fill="#f9e2af"/>
  <circle cx="164" cy="104" r="10" fill="#a6e3a1"/>

  <!-- Brand Text: SCRIPT -->
  <text x="384" y="114" fill="#89b4fa" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="28" text-anchor="end" letter-spacing="2">SCRIPT</text>

  <!-- Center Code Extract Icon Motif -->
  <!-- Left Bracket < -->
  <path d="M 140 210 L 80 270 L 140 330" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right Bracket > -->
  <path d="M 240 210 L 300 270 L 240 330" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Slash / Extraction Arrow -->
  <path d="M 210 180 L 170 360" stroke="#f9e2af" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Extract Dynamic Lightning / Arrow Motif -->
  <path d="M 320 230 L 410 230 L 350 310 L 430 310 L 330 430 L 360 330 L 290 330 Z" fill="url(#ficusGrad)" stroke="#11111b" stroke-width="4"/>

  <!-- Sub-label by FICUS -->
  <text x="256" y="425" fill="#a6adc8" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="20" text-anchor="middle" letter-spacing="4">BY FICUS (FICUSAI)</text>
</svg>